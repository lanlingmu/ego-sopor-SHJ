<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>SHJ的小网站们-3D 沙纹</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #fff; font-family: sans-serif; }
        #info { position: absolute; top: 15px; left: 15px; z-index: 10; pointer-events: none; }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #deff9a; }
        p { margin: 0; font-size: 14px; color: #aaa; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="拖动视角，调节光影，让谐振波在平面上长出形状。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site-nav.css">
</head>
<body>
<a class="shj-home" href="../" aria-label="返回总站：SHJ的小网站们"><span aria-hidden="true">⌂</span><span>SHJ的小网站们-3D 沙纹</span></a>
    <div id="info">
        <h1>3D 谐振波立体感测试仪</h1>
        <p>💡 左键拖拽旋转视角，滚轮缩放。<br>👉 在右上角调整光影和图形参数，观察立体感的变化。</p>
    </div>

<script>
    // 1. 场景基础设置 (Scene, Camera, Renderer)
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.02); // 加一点雾气，增加空间景深感

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -30, 25);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 2. 光影设置 (立体感的核心)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2); // 极暗的环境光
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(10, 10, 20); // 默认侧逆光，最容易凸显立体轮廓
    scene.add(dirLight);

    // 3. 材质与网格 (相当于你在 TD 里建的 Grid 和 Constant)
    // 使用高密度平面网格，分辨率 300x300
    const geometry = new THREE.PlaneGeometry(40, 40, 300, 300); 
    
    // 使用 Phong 材质，它能接收光照、产生高光反光
    const material = new THREE.MeshPhongMaterial({
        color: 0x88ccff,       // 偏冷色的沙粒感
        emissive: 0x000000,
        specular: 0xffffff,    // 高光颜色
        shininess: 80,         // 光泽度(关键参数)
        wireframe: false,
        side: THREE.DoubleSide
    });

    const plane = new THREE.Mesh(geometry, material);
    scene.add(plane);

    // 4. 控制面板参数与逻辑
    const params = {
        patternN: 3,
        patternM: 4,
        heightScale: 2.5,
        lightX: 10,
        lightY: 10,
        lightZ: 20,
        lightIntensity: 1.5,
        shininess: 80,
        wireframe: false
    };

    // 核心位移函数：用数学公式把平面顶成 3D 山脉
    function updateChladni() {
        const positions = plane.geometry.attributes.position.array;
        
        // 遍历网格上的每一个点
        for (let i = 0; i < positions.length; i += 3) {
            let x = positions[i]; 
            let y = positions[i+1]; 
            
            // 将坐标映射到公式需要的范围
            let nx = x / 20.0; 
            let ny = y / 20.0;
            let pi = Math.PI;

            // 克拉尼波纹公式
            let wave = Math.cos(params.patternN * pi * nx) * Math.cos(params.patternM * pi * ny) - 
                       Math.cos(params.patternM * pi * nx) * Math.cos(params.patternN * pi * ny);
            
            // 越接近波节线（0），高度越高，模拟沙堆
            let height = (1.0 - smoothstep(0.0, 0.5, Math.abs(wave))) * params.heightScale;
            
            // 修改 Z 轴高度
            positions[i+2] = height; 
        }
        
        // 通知显卡更新模型
        plane.geometry.attributes.position.needsUpdate = true;
        // 【最关键的一步】：重新计算法线。如果没有这句，光影就不会随着模型的凹凸产生阴影！
        plane.geometry.computeVertexNormals(); 
    }

    // 辅助函数：平滑过渡，类似 TD 里的 smoothstep
    function smoothstep(edge0, edge1, x) {
        let t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
    }

    // 5. 绑定右上角 UI 面板
    const gui = new dat.GUI();
    
    const f1 = gui.addFolder('图形形状 (模拟音乐变化)');
    f1.add(params, 'patternN', 1, 10).step(1).onChange(updateChladni);
    f1.add(params, 'patternM', 1, 10).step(1).onChange(updateChladni);
    f1.add(params, 'heightScale', 0, 10).name('3D 起伏高度').onChange(updateChladni);
    f1.open();

    const f2 = gui.addFolder('光影与立体感 (照明)');
    f2.add(params, 'lightX', -30, 30).onChange(v => dirLight.position.x = v);
    f2.add(params, 'lightY', -30, 30).onChange(v => dirLight.position.y = v);
    f2.add(params, 'lightZ', 0, 50).onChange(v => dirLight.position.z = v);
    f2.add(params, 'lightIntensity', 0, 5).name('灯光强度').onChange(v => dirLight.intensity = v);
    f2.open();

    const f3 = gui.addFolder('表面材质');
    f3.add(params, 'shininess', 0, 200).name('高光反光度').onChange(v => material.shininess = v);
    f3.add(params, 'wireframe').name('显示网格线').onChange(v => material.wireframe = v);
    f3.open();

    // 初始化生成一次图形
    updateChladni();

    // 6. 渲染循环
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update(); // 鼠标惯性
        
        // 让模型自己缓慢旋转，更有全息悬浮感
        plane.rotation.z += 0.001; 
        
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
