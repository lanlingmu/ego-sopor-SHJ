    <script>
        // --- 核心变量 ---
        let scene, camera, renderer, composer, bloomPass, raycaster;
        let cardsGroup = new THREE.Group();
        let cards = [];
        let particles = [];
        
        let state = 'INIT'; // 状态机: INIT, IDLE, POINTING, DRAWN, DISSIPATING
        let hoveredCard = null;
        let drawnCard = null;
        
        let targetScrollX = 0;
        let currentScrollX = 0;
        let scrollVelocity = 0;
        let prevHandX = 0.5;
        let prevHandY = 0.5;

        // --- 卡牌配置 ---
        const CARD_COUNT = 22;
        const CARD_WIDTH = 2;
        const CARD_HEIGHT = 3.5;
        const CARD_DEPTH = 0.05;
        const SPACING = 2.4;
        const MAJOR_ARCANA = [
            '0 The Fool', 'I The Magician', 'II The High Priestess', 'III The Empress', 
            'IV The Emperor', 'V The Hierophant', 'VI The Lovers', 'VII The Chariot', 
            'VIII Strength', 'IX The Hermit', 'X Wheel of Fortune', 'XI Justice', 
            'XII The Hanged Man', 'XIII Death', 'XIV Temperance', 'XV The Devil', 
            'XVI The Tower', 'XVII The Star', 'XVIII The Moon', 'XIX The Sun', 
            'XX Judgement', 'XXI The World'
        ];

        // --- 初始化 Three.js ---
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a0c, 0.015);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 100);
            camera.position.set(0, 2, 16);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0); // Transparent to show CSS backgrounds
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            // 灯光布置，氛围感
            const ambient = new THREE.AmbientLight(0xffffff, 0.4); // 极弱全局光
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffedd6, 1.2); // 暖色主光
            dirLight.position.set(0, 10, 8); // Centered
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            const fillLight = new THREE.PointLight(0xc4a163, 1, 20); // Center soft golden glow
            fillLight.position.set(0, 0, 5); 
            scene.add(fillLight);

            // Bloom 后期泛光处理
            const renderScene = new THREE.RenderPass(scene, camera);
            bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.6, 0.2);
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createCards();
            window.addEventListener('resize', onWindowResize, false);
            requestAnimationFrame(animate);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 生成质感卡牌贴图 ---
        function drawArcanaArt(ctx, index) {
            ctx.save();
            ctx.translate(256, 380);

            const primary = '#e0b876';
            const secondary = '#cda153';
            const accent = '#ffffff';

            // Intricate Art Nouveau Border Box
            ctx.strokeStyle = primary;
            ctx.lineWidth = 4;
            ctx.strokeRect(-216, -316, 432, 852);
            ctx.lineWidth = 1;
            ctx.strokeRect(-208, -308, 416, 836);
            ctx.strokeRect(-204, -304, 408, 828);

            // Decorate text separator
            ctx.beginPath();
            ctx.moveTo(-204, 300);
            ctx.lineTo(204, 300);
            ctx.moveTo(-204, 310);
            ctx.lineTo(204, 310);
            ctx.stroke();

            // Ornate corners for the top frame of the image
            for (let dx of [-1, 1]) {
                for (let yy of [-310, 526]) { // top and bottom bounds
                    ctx.save();
                    ctx.translate(dx * 210, yy);
                    ctx.scale(dx, yy === -310 ? -1 : 1);

                    // Multi-layered corner rings
                    ctx.beginPath();
                    ctx.arc(-22, -22, 38, 0, Math.PI * 2);
                    ctx.strokeStyle = secondary;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(-22, -22, 28, 0, Math.PI * 2);
                    ctx.strokeStyle = primary;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(-22, -22, 14, 0, Math.PI * 2);
                    ctx.fillStyle = accent;
                    ctx.fill();
                    ctx.stroke();

                    // Corner leaf swoosh
                    ctx.beginPath();
                    ctx.moveTo(16, -60);
                    ctx.quadraticCurveTo(-22, -22, -60, 16);
                    ctx.quadraticCurveTo(-30, -30, 16, -60);
                    ctx.strokeStyle = primary;
                    ctx.stroke();

                    ctx.restore();
                }
            }

            // Central Emblems (Top of image box, Bottom of image box, and Bottom of Text Box)
            for (let yy of [-300, 290, 520]) {
                ctx.save();
                ctx.translate(0, yy);

                ctx.beginPath();
                ctx.arc(0, 0, 35, 0, Math.PI * 2);
                ctx.strokeStyle = primary;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, 28, 0, Math.PI * 2);
                ctx.strokeStyle = secondary;
                ctx.stroke();

                ctx.strokeStyle = primary;
                if (yy === -300) { // Top Emblem (Star)
                    ctx.beginPath();
                    for (let i = 0; i < 8; i++) {
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(i * Math.PI / 4) * 20, Math.sin(i * Math.PI / 4) * 20);
                    }
                    ctx.stroke();
                    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fillStyle = accent; ctx.fill(); ctx.stroke();
                } else { // Crescent
                    ctx.beginPath();
                    ctx.arc(0, 8, 16, Math.PI + Math.PI / 6, -Math.PI / 6);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // Set main lines to primary color for the inner artwork
            ctx.strokeStyle = primary;
            ctx.fillStyle = primary;

            // Arch Frame
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-160, 220);
            ctx.lineTo(-160, -120);
            ctx.arc(0, -120, 160, Math.PI, 0);
            ctx.lineTo(160, 220);
            ctx.closePath();
            ctx.stroke();

            ctx.lineWidth = 0.5;
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                ctx.moveTo(-170 - i*5, 230 + i*5);
                ctx.lineTo(-170 - i*5, -120);
                ctx.arc(0, -120, 170 + i*5, Math.PI, 0);
                ctx.lineTo(170 + i*5, 230 + i*5);
                ctx.closePath();
                ctx.stroke();
            }

            // Draw Title Text Before Clipping
            ctx.save();
            ctx.translate(0, 360);
            ctx.textAlign = 'center';
            ctx.font = '30px "Times New Roman", serif';
            ctx.fillStyle = primary;
            ctx.fillText('MAJOR ARCANA', 0, 0);
            
            ctx.font = 'italic 52px "Times New Roman", serif';
            ctx.fillStyle = accent;
            ctx.fillText(MAJOR_ARCANA[index % MAJOR_ARCANA.length], 0, 80);
            ctx.restore();

            // Clip inner arch
            ctx.beginPath();
            ctx.moveTo(-160, 220);
            ctx.lineTo(-160, -120);
            ctx.arc(0, -120, 160, Math.PI, 0);
            ctx.lineTo(160, 220);
            ctx.closePath();
            ctx.clip();
            
            // Helper functions
            const drawPoly = (r, sides, rot=0, cx=0, cy=0) => {
                ctx.beginPath();
                for(let i=0; i<=sides; i++) {
                    const ang = rot + i * (Math.PI*2/sides);
                    if(i===0) ctx.moveTo(cx+Math.cos(ang)*r, cy+Math.sin(ang)*r);
                    else ctx.lineTo(cx+Math.cos(ang)*r, cy+Math.sin(ang)*r);
                }
                ctx.stroke();
            };
            const drawStar = (r, points, rot=0, step=2, cx=0, cy=0) => {
                ctx.beginPath();
                for(let i=0; i<=points; i++) {
                    const ang = rot + (i * step) * (Math.PI*2/points);
                    if(i===0) ctx.moveTo(cx+Math.cos(ang)*r, cy+Math.sin(ang)*r);
                    else ctx.lineTo(cx+Math.cos(ang)*r, cy+Math.sin(ang)*r);
                }
                ctx.stroke();
            };
            const drawInfinity = (scale, cx=0, cy=0) => {
                ctx.beginPath();
                for(let t=0; t<Math.PI*2; t+=0.05) {
                    const r = scale * Math.sqrt(Math.abs(Math.cos(2*t)));
                    const x = cx + r * Math.cos(t);
                    const y = cy + r * Math.sin(t);
                    if(t===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.stroke();
            };
            const drawRays = (cx, cy, r0, r1, num, rot=0) => {
                ctx.beginPath();
                for(let i=0; i<num; i++) {
                    const a = rot + i * (Math.PI*2/num);
                    ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
                    ctx.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
                }
                ctx.stroke();
            };
            const drawWaves = (ys, amp, freq, steps) => {
                ctx.beginPath();
                for(let i=0; i<=steps; i++) {
                    const x = -160 + (320 * (i/steps));
                    const y = ys + Math.sin(x * freq) * amp;
                    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.stroke();
            };
            
            ctx.lineWidth = 1.0;
            switch (index % 22) {
                case 0: // 0. The Fool
                    drawRays(-50, -80, 20, 200, 36);
                    ctx.beginPath(); ctx.arc(-50, -80, 40, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(160, 220); ctx.lineTo(40, 220); ctx.lineTo(-20, 100); ctx.lineTo(160, -20); ctx.stroke();
                    for(let i=0; i<30; i++) { ctx.beginPath(); ctx.moveTo(-20+i*6, 100+i*4); ctx.lineTo(-20+i*6, 220); ctx.stroke(); }
                    ctx.beginPath();
                    for(let i=0; i<200; i++) {
                        const r = i*1.2; const a = i*0.1;
                        const px = r * Math.cos(a); const py = 40 - r * Math.sin(a);
                        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
                    }
                    ctx.stroke();
                    break;
                case 1: // I. The Magician
                    drawInfinity(50, 0, -180);
                    ctx.beginPath(); ctx.moveTo(0, -140); ctx.lineTo(0, 140); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(-80, -120); ctx.moveTo(0, 0); ctx.lineTo(80, 80); ctx.stroke();
                    ctx.strokeRect(-100, 140, 200, 20); ctx.beginPath(); ctx.moveTo(-80, 160); ctx.lineTo(-80, 220); ctx.moveTo(80, 160); ctx.lineTo(80, 220); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-70, 120); ctx.lineTo(-50, 120); ctx.moveTo(-60, 140); ctx.lineTo(-60, 100); ctx.stroke(); 
                    ctx.beginPath(); ctx.arc(-20, 120, 15, 0, Math.PI); ctx.lineTo(-20, 140); ctx.stroke(); 
                    drawStar(15, 5, -Math.PI/2, 2, 20, 120); 
                    ctx.beginPath(); ctx.moveTo(50, 140); ctx.lineTo(70, 100); ctx.stroke(); 
                    break;
                case 2: // II. The High Priestess
                    ctx.fillStyle = '#111'; ctx.fillRect(-120, -50, 40, 270); ctx.strokeRect(-120, -50, 40, 270);
                    ctx.fillStyle = '#e0b876'; ctx.fillRect(80, -50, 40, 270); ctx.strokeRect(80, -50, 40, 270);
                    ctx.beginPath(); ctx.rect(-130, -70, 60, 20); ctx.rect(70, -70, 60, 20); ctx.stroke();
                    drawStar(20, 6, 0, 2, -100, -80); drawStar(20, 6, 0, 2, 100, -80);
                    ctx.beginPath(); ctx.arc(0, 180, 40, -Math.PI/2, Math.PI/2, true); ctx.arc(15, 180, 40, Math.PI/2, -Math.PI/2, false); ctx.stroke();
                    ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(-80, -40); ctx.lineTo(80, -40); ctx.stroke(); ctx.setLineDash([]);
                    for(let i=0; i<5; i++) { ctx.beginPath(); ctx.arc(-60+i*30, -20, 10, 0, Math.PI*2); ctx.stroke(); }
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, 100); ctx.lineTo(40, 100); ctx.closePath(); ctx.stroke();
                    ctx.strokeRect(-20, 100, 40, 60);
                    break;
                case 3: // III. The Empress
                    for(let i=0; i<12; i++) { drawStar(8, 6, 0, 2, Math.cos(i * Math.PI/6)*70, -120 + Math.sin(i * Math.PI/6)*70); }
                    ctx.beginPath(); ctx.moveTo(0, -60); ctx.quadraticCurveTo(-100, 80, -120, 220); ctx.quadraticCurveTo(0, 200, 120, 220); ctx.quadraticCurveTo(100, 80, 0, -60); ctx.stroke();
                    for(let i=0; i<10; i++) { ctx.beginPath(); ctx.moveTo(0, -60); ctx.quadraticCurveTo(-100+i*20, 80, -120+i*24, 220); ctx.stroke(); }
                    ctx.beginPath(); ctx.arc(80, 120, 30, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(80, 120, 20, 0, Math.PI*2); ctx.stroke(); 
                    ctx.beginPath(); ctx.arc(80, 120, 8, 0, Math.PI*2); ctx.moveTo(80,128); ctx.lineTo(80,140); ctx.moveTo(70,135); ctx.lineTo(90,135); ctx.stroke();
                    ctx.beginPath(); for(let i=0; i<10; i++){ ctx.moveTo(-160, 40+i*5); ctx.quadraticCurveTo(-100, 60+i*10, -50, 220); } ctx.stroke();
                    break;
                case 4: // IV. The Emperor
                    ctx.beginPath(); ctx.moveTo(-160, 220); ctx.lineTo(-80, 50); ctx.lineTo(0, 220); ctx.moveTo(0, 220); ctx.lineTo(80, 20); ctx.lineTo(160, 220); ctx.stroke();
                    for(let i=0; i<5; i++) { ctx.beginPath(); ctx.moveTo(-80, 50); ctx.lineTo(-80+i*15, 220); ctx.moveTo(80, 20); ctx.lineTo(80-i*15, 220); ctx.stroke(); }
                    ctx.strokeRect(-60, 40, 120, 120); ctx.strokeRect(-50, 50, 100, 100);
                    ctx.beginPath(); ctx.moveTo(-60, 40); ctx.arc(-80, 20, 20, 0, -Math.PI); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(60, 40); ctx.arc(80, 20, 20, Math.PI, 0); ctx.stroke();
                    ctx.strokeRect(-30, -50, 60, 90); ctx.beginPath(); ctx.moveTo(-30, -50); ctx.lineTo(0, -90); ctx.lineTo(30, -50); ctx.stroke();
                    ctx.beginPath(); ctx.arc(40, -10, 10, 0, Math.PI*2); ctx.stroke();
                    ctx.beginPath(); ctx.ellipse(-40, -20, 5, 10, 0, 0, Math.PI*2); ctx.moveTo(-40, -10); ctx.lineTo(-40, 10); ctx.moveTo(-45, 0); ctx.lineTo(-35, 0); ctx.stroke();
                    break;
                case 5: // V. The Hierophant
                    ctx.strokeRect(-120, -100, 30, 320); ctx.strokeRect(90, -100, 30, 320);

                    ctx.beginPath(); ctx.moveTo(0, -60); ctx.quadraticCurveTo(60, 0, 0, 80); ctx.quadraticCurveTo(-60, 0, 0, -60); ctx.stroke(); 
                    for(let i=0; i<10; i++) { ctx.beginPath(); ctx.moveTo(0, -60); ctx.quadraticCurveTo(60-i*5, 0, 0, 80); ctx.stroke(); }
                    ctx.beginPath(); ctx.moveTo(-40, -40); ctx.lineTo(40, -20); ctx.stroke(); 
                    ctx.beginPath(); ctx.moveTo(-20, 80); ctx.lineTo(-40, 140); ctx.moveTo(20, 80); ctx.lineTo(40, 120); ctx.lineTo(0, 100); ctx.stroke(); 
                    ctx.beginPath(); ctx.moveTo(-50, -60); ctx.lineTo(-30, -20); ctx.moveTo(30, -40); ctx.lineTo(50, 0); ctx.stroke();
                    drawStar(20, 5, 0, 2, -140, -200); 
                    drawPoly(20, 3, 0, 140, -200); 
                    drawRays(-140, 200, 10, 25, 12); ctx.beginPath(); ctx.arc(-140, 200, 10, 0, Math.PI*2); ctx.stroke(); 
                    ctx.strokeRect(120, 180, 40, 40); ctx.beginPath(); ctx.moveTo(120, 180); ctx.lineTo(160, 220); ctx.stroke(); 
                    break;
            }

            ctx.restore();
        }

        function createTextureBase(isFront, index) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            // 深邃背景
            const grad = ctx.createLinearGradient(0, 0, 0, 1024);
            grad.addColorStop(0, '#0a0a0c');
            grad.addColorStop(1, '#1b1b22');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 1024);

            // 中古华丽边框
            ctx.strokeStyle = '#cda153';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 14;
            ctx.strokeRect(20, 20, 472, 984);
            ctx.lineWidth = 4;
            ctx.strokeRect(40, 40, 432, 944);
            
            // 四角装饰锚点
            ctx.fillStyle = '#cda153';
            const r = 12;
            [[40,40], [472,40], [40, 984], [472, 984]].forEach(([x,y]) => {
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
            });

            if (!isFront) {
                // 背面：复杂古典花纹 + 铃兰
                ctx.save();
                ctx.translate(256, 512);

                // 外围多重星盘/阵法
                ctx.strokeStyle = 'rgba(205, 161, 83, 0.2)';
                for(let i=0; i<12; i++) {
                    ctx.rotate(Math.PI / 6);
                    ctx.beginPath();
                    ctx.ellipse(0, 180, 220, 25, 0, 0, Math.PI*2);
                    ctx.stroke();
                }
                
                // 中心复古边框环
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 140 + i*15, 0, Math.PI*2);
                    ctx.lineWidth = 2 + (i%2)*2;
                    ctx.strokeStyle = '#cda153';
                    ctx.stroke();
                }

                // 核心元素：铃兰 (Lily of the Valley) 优雅的曲线藤蔓
                ctx.strokeStyle = '#cda153';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(0, 230);
                ctx.quadraticCurveTo(-90, 0, 0, -280);
                ctx.stroke();

                // 纯白铃兰花朵垂坠
                ctx.fillStyle = '#f9f9f9';
                const flowerPos = [
                    {x: -45, y: -200, rot: -0.6},
                    {x: -60, y: -80, rot: -0.4},
                    {x: -50, y: 40, rot: -0.2},
                    {x: -15, y: 160, rot: 0}
                ];
                flowerPos.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    // 花钟形状
                    ctx.beginPath();
                    ctx.moveTo(0, -18);
                    ctx.quadraticCurveTo(28, -5, 28, 20);
                    ctx.quadraticCurveTo(0, 32, -28, 20);
                    ctx.quadraticCurveTo(-28, -5, 0, -18);
                    ctx.fill();
                    // 花蒂
                    ctx.fillStyle = '#cda153';
                    ctx.beginPath(); ctx.arc(0, -22, 5, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                });
                ctx.restore();
            } else {
                // 正面：古典线稿牌面占位
                drawArcanaArt(ctx, index);
            }
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 16;
            return tex;
        }

        // --- 创建 3D 牌组 ---
        function createCards() {
            const geometry = new THREE.BoxGeometry(CARD_WIDTH, CARD_HEIGHT, CARD_DEPTH);
            const backTex = createTextureBase(false, 0);
            const sideMat = new THREE.MeshStandardMaterial({ color: 0xcda153, roughness: 0.5, metalness: 0.8 });

            for(let i=0; i<CARD_COUNT; i++) {
                const frontTex = createTextureBase(true, i);
                
                // Index: +x, -x, +y, -y, +z(front), -z(back)
                const frontMat = new THREE.MeshStandardMaterial({ map: frontTex, roughness: 0.8, metalness: 0.2 });
                const backMat = new THREE.MeshStandardMaterial({ map: backTex, roughness: 0.8, metalness: 0.2 });
                const materials = [sideMat, sideMat, sideMat, sideMat, frontMat, backMat];
                
                const card = new THREE.Mesh(geometry, materials);
                
                const ox = (i - CARD_COUNT/2 + 0.5) * SPACING;
                // 隐藏于视线下方，准备入场
                card.position.set(ox, -15, -5);
                card.rotation.y = Math.PI; // 背面 (-z) 朝向摄像机
                
                card.castShadow = true;
                card.receiveShadow = true;
                
                card.userData = { id: i, originalX: ox, originalY: 0, originalZ: 0, baseRotX: (Math.random() - 0.5) * 0.1 };
                
                cardsGroup.add(card);
                cards.push(card);
            }
            scene.add(cardsGroup);
        }

        // --- 动画序列 ---
        function triggerSpawnAnimation() {
            state = 'SPAWNING';
            document.getElementById('message').classList.remove('visible');
            
            cards.forEach((card, i) => {
                const delay = i * 0.08;
                gsap.to(card.position, {
                    y: card.userData.originalY,
                    z: card.userData.originalZ,
                    duration: 2.5,
                    ease: "power4.out",
                    delay: delay
                });
                gsap.to(card.rotation, {
                    x: card.userData.baseRotX, // 微微的不规则，增加真实感
                    duration: 2.5,
                    ease: "power4.out",
                    delay: delay
                });
            });

            setTimeout(() => { state = 'IDLE'; }, 2.5 * 1000 + CARD_COUNT * 80);
        }

        function drawCardObj(card) {
            state = 'DRAWN';
            
            // 从序列群组中释放，保证世界坐标连续
            const wp = new THREE.Vector3();
            card.getWorldPosition(wp);
            cardsGroup.remove(card);
            scene.add(card);
            card.position.copy(wp);

            // 其余牌阵暗淡退场
            gsap.to(cardsGroup.position, { z: -10, y: -2, duration: 2, ease: "power2.inOut" });
            cards.forEach(c => {
                if (c !== card) {
                    c.material.forEach(m => {
                        gsap.to(m.color, { r: 0.1, g: 0.1, b: 0.1, duration: 2 });
                    });
                }
            });

            // 抽中卡牌高亮浮前并翻转
            gsap.to(card.position, {
                x: 0, y: 1.0, z: 8, // Strictly center in camera's view (camera is at y:2, z:16 looking at 0,0,0)
                duration: 2.5,
                ease: "power3.inOut"
            });
            gsap.to(card.rotation, {
                x: 0, y: 0, z: 0, // 转回正面
                duration: 2.5,
                ease: "power3.inOut",
                onComplete: () => {
                    // 正面轻微发光，间隔3秒
                    gsap.to(card.material[4].emissive, {
                        r: 0.05, g: 0.05, b: 0.05, 
                        duration: 1.5, 
                        yoyo: true, 
                        repeat: -1, 
                        repeatDelay: 3.0,
                        ease: "power2.inOut"
                    });
                }
            });
        }

        function returnCardObj(card) {
            state = 'RETURNING';
            
            gsap.killTweensOf(card.material[4].emissive);
            gsap.killTweensOf(card.material[5].emissive);

            // Re-attach to group to move safely with it
            cardsGroup.attach(card);

            gsap.to(card.position, {
                x: card.userData.originalX, 
                y: card.userData.originalY, 
                z: card.userData.originalZ,
                duration: 1.5,
                ease: "power3.inOut"
            });
            gsap.to(card.rotation, {
                x: 0, y: Math.PI, z: 0, // 转回背面
                duration: 1.5,
                ease: "power3.inOut",
                onComplete: () => {
                    gsap.to(card.material[5].emissive, {r: 0, g: 0, b: 0, duration: 0.5});
                    if (card.material[4]) gsap.to(card.material[4].emissive, {r: 0, g: 0, b: 0, duration: 0.5});
                    state = 'IDLE';
                    drawnCard = null;
                }
            });

            // Restore other cards
            gsap.to(cardsGroup.position, { z: 0, y: 0, duration: 1.5, ease: "power2.inOut" });
            cards.forEach(c => {
                if (c !== card) {
                    c.material.forEach(m => {
                        gsap.to(m.color, { r: 1, g: 1, b: 1, duration: 1.5 });
                    });
                }
            });
            
            const msg = document.getElementById('message');
            msg.classList.remove('visible');
            const hud = document.querySelector('#bottom-hud-text p');
            if (hud) hud.innerText = "HOVER TO REVEAL";
        }

        // --- MediaPipe 手势识别逻辑 ---
        function initHandTracking() {
            const videoElem = document.querySelector('.input_video');
            const canvasElement = document.querySelector('.output_canvas');
            const canvasCtx = canvasElement.getContext('2d');
            
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1, // 快，省资源
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });
            hands.onResults(onResults);

            const camObj = new Camera(videoElem, {
                onFrame: async () => { 
                    try {
                        await hands.send({image: videoElem}); 
                    } catch(e) {
                        console.error('Hands send error', e);
                    }
                },
                width: 640, height: 480
            });
            
            camObj.start().then(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('message').classList.add('visible');
            }).catch(e => {
                document.getElementById('loading').innerText = "CAMERA ACCESS DENIED";
                document.getElementById('loading').style.color = "#ff5555";
                document.getElementById('loading').style.opacity = "1";
                console.error(e);
            });
        }

        let lastShuffleTime = 0;

        function shuffleCards() {
            const now = Date.now();
            if (now - lastShuffleTime < 1500) return;
            if (state !== 'IDLE' && state !== 'POINTING') return;
            lastShuffleTime = now;
            
            const prevState = state;
            state = 'SHUFFLING';

            const positions = cards.map(c => ({
                id: c.userData.id,
                ox: c.userData.originalX,
                oy: c.userData.originalY,
                oz: c.userData.originalZ,
                bx: c.userData.baseRotX
            }));
            
            // Fisher-Yates shuffle
            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }
            
            let completed = 0;
            cards.forEach((card, i) => {
                const p = positions[i];
                card.userData.originalX = p.ox;
                card.userData.originalY = p.oy;
                card.userData.originalZ = p.oz;
                card.userData.baseRotX = p.bx;
                
                // Animate to new position with a slight pop-up
                gsap.killTweensOf(card.position);
                gsap.killTweensOf(card.rotation);
                gsap.to(card.rotation, {
                    y: Math.PI,
                    duration: 0.4
                });
                gsap.to(card.position, {
                    x: p.ox,
                    y: p.oy + Math.random() * 1.5 + 0.5,
                    z: p.oz + Math.random() * 1.0,
                    duration: 0.4,
                    ease: "power2.out",
                    onComplete: () => {
                        gsap.to(card.position, {
                            x: p.ox,
                            y: p.oy,
                            z: p.oz,
                            duration: 0.5,
                            ease: "power2.inOut",
                            onComplete: () => {
                                completed++;
                                if (completed === cards.length) {
                                    state = 'IDLE';
                                }
                            }
                        });
                    }
                });
            });
        }

        function getDist(p1, p2) {
            return Math.sqrt((p1.x-p2.x)**2 + (p1.y-p2.y)**2 + (p1.z-p2.z)**2);
        }

        function onResults(results) {
            const canvasElement = document.querySelector('.output_canvas');
            const canvasCtx = canvasElement.getContext('2d');
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            const calib = document.getElementById('calib-lvl');

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                if (calib) calib.innerText = "WAITING FOR HAND";
                canvasCtx.restore();
                return;
            }
            if (calib) calib.innerText = "TRACKING ACTIVE";

            const marks = results.multiHandLandmarks[0];
            
            if (window.drawConnectors) {
                drawConnectors(canvasCtx, marks, HAND_CONNECTIONS, {color: '#c4a163', lineWidth: 4});
                drawLandmarks(canvasCtx, marks, {color: '#ffffff', lineWidth: 1, radius: 3});
            }
            canvasCtx.restore();

            const wrist = marks[0];
            const thumb = marks[4];
            const index = marks[8];
            const middle = marks[12];
            const ring = marks[16];
            const pinky = marks[20];

            // 图像是镜像的 (ScaleX: -1)，X翻转计算物理意义上的位置
            const physicalX = 1 - wrist.x; 
            const physicalY = wrist.y;
            const indexPxX = (1 - index.x) * window.innerWidth;
            const indexPxY = index.y * window.innerHeight;
            
            const velocityX = physicalX - prevHandX;
            prevHandX = physicalX;

            const velocityY = physicalY - prevHandY;
            prevHandY = physicalY;

            const baseSize = getDist(wrist, marks[5]) || 0.1;

            // 分析姿态: 指尖到手腕的距离 > 较低关节点到手腕的距离
            const iExt = getDist(wrist, index) > getDist(wrist, marks[6]);
            const mExt = getDist(wrist, middle) > getDist(wrist, marks[10]);
            const rExt = getDist(wrist, ring) > getDist(wrist, marks[14]);
            const pExt = getDist(wrist, pinky) > getDist(wrist, marks[18]);

            const isOpenPalm = iExt && mExt && rExt && pExt;
            const isPointing = iExt && !mExt && !rExt && !pExt;
            const isPinching = getDist(thumb, index) < 0.05 && !mExt && !rExt;

            const cursor = document.getElementById('cursor');

            if (state === 'INIT') {
                if (isOpenPalm && Math.abs(velocityX) > 0.02) {
                    triggerSpawnAnimation();
                    const hud = document.querySelector('#bottom-hud-text p');
                    if (hud) hud.innerText = "HOVER TO REVEAL";
                }
            } else if (state === 'IDLE') {
                // 更新高亮手部点
                cursor.style.display = 'block';
                cursor.style.transform = `translate(${indexPxX}px, ${indexPxY}px)`;
                
                // 刹车与滑动（惯性控制）
                if (isOpenPalm) {
                    scrollVelocity *= 0.82; // 张开手缓缓停止

                    // 检测快速水平挥手来打乱牌阵
                    if (Math.abs(velocityX) > 0.06) {
                        shuffleCards();
                    }
                } else if (!isPointing && !isPinching) {
                    if (Math.abs(velocityX) > 0.005) {
                        scrollVelocity += velocityX * 1.8; // 推牌阻尼增量
                    }
                }
                
                if (isPointing) {
                    state = 'POINTING';
                }
            } else if (state === 'POINTING') {
                cursor.style.display = 'block';
                cursor.style.transform = `translate(${indexPxX}px, ${indexPxY}px)`;

                // 物理坐标转换 WebGL NDC
                const ndcX = (indexPxX / window.innerWidth) * 2 - 1;
                const ndcY = -(indexPxY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
                const intersects = raycaster.intersectObjects(cards);

                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    if (hoveredCard !== hit) {
                        // 还原上一张
                        if (hoveredCard) clearHover(hoveredCard);
                        hoveredCard = hit;
                        // 高亮这一张，闪一下
                        gsap.to(hit.material[5].emissive, { r: 0.3, g: 0.3, b: 0.3, duration: 0.3, yoyo: true, repeat: 1 }); // 发柔光触发Bloom
                    }
                } else {
                    if (hoveredCard) {
                        clearHover(hoveredCard);
                        hoveredCard = null;
                        if (!isPointing) state = 'IDLE';
                    }
                }

                if (isPinching && hoveredCard) {
                    drawnCard = hoveredCard;
                    cursor.style.display = 'none';
                    drawCardObj(drawnCard);
                    const hud = document.querySelector('#bottom-hud-text p');
                    if (hud) hud.innerText = "WAVE DOWN TO RETURN";
                }
                if (!isPointing && !isPinching) {
                    state = 'IDLE';
                }
            } else if (state === 'DRAWN') {
                if (isOpenPalm && velocityY > 0.05) {
                    returnCardObj(drawnCard);
                }
            } else {
                cursor.style.display = 'none';
            }
        }

        function clearHover(card) {
            gsap.killTweensOf(card.material[5].emissive);
            gsap.to(card.material[5].emissive, { r: 0, g: 0, b: 0, duration: 0.5 });
        }


        // --- 主帧渲染 ---
        function animate() {
            requestAnimationFrame(animate);

            // 物理惯性更新
            if (state === 'IDLE' || state === 'POINTING') {
                currentScrollX += scrollVelocity;
                scrollVelocity *= 0.94; // 自然摩擦力衰减
                
                cardsGroup.position.x = currentScrollX;
                
                // 边缘阻力与限制
                const limit = ((CARD_COUNT-1) * SPACING) / 2;
                if (cardsGroup.position.x > limit) {
                    cardsGroup.position.x = limit;
                    scrollVelocity = -scrollVelocity * 0.2; // 轻微反弹
                } else if (cardsGroup.position.x < -limit) {
                    cardsGroup.position.x = -limit;
                    scrollVelocity = -scrollVelocity * 0.2;
                }
            }

            // --- 鱼眼效果 (Fish-eye Effect) ---
            if (state !== 'INIT' && state !== 'SPAWNING' && state !== 'SHUFFLING') {
                cards.forEach(card => {
                    if (card !== drawnCard) {
                        const worldX = card.userData.originalX + cardsGroup.position.x;
                        const dist = Math.abs(worldX);
                        
                        const radius = 12;
                        const maxZ = 2.5;    // 中心突出高度
                        const maxY = 0.4;    // 中心抬高
                        const maxRot = Math.PI / 10; // 边缘最大侧转幅度
                        
                        let targetZ = 0;
                        let targetY = 0;
                        let targetRotY = Math.PI;
                        let targetRotX = card.userData.baseRotX || 0;
                        
                        if (dist < radius) {
                            const factor = Math.cos((dist / radius) * (Math.PI / 2));
                            const smoothFactor = factor * factor; // 强化中心凸起
                            targetZ = maxZ * smoothFactor;
                            targetY = maxY * smoothFactor;
                            targetRotY = Math.PI - (worldX / radius) * maxRot;
                        } else {
                            targetRotY = Math.PI - Math.sign(worldX) * maxRot;
                        }

                        if (card === hoveredCard) {
                            targetY += 0.8;
                            targetZ += 1.0;
                            targetRotX = -0.15;
                        }
                        
                        card.position.z += (targetZ - card.position.z) * 0.12;
                        card.position.y += (targetY - card.position.y) * 0.12;
                        card.rotation.y += (targetRotY - card.rotation.y) * 0.12;
                        card.rotation.x += (targetRotX - card.rotation.x) * 0.12;
                    }
                });
            }

            // 粒子更新
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= 0.006;
                p.mesh.material.opacity = p.life;
                
                const ptPos = p.mesh.geometry.attributes.position.array;
                for (let j = 0; j < ptPos.length; j+=3) {
                    ptPos[j] += p.vels[j/3].x;
                    ptPos[j+1] += p.vels[j/3].y;
                    ptPos[j+2] += p.vels[j/3].z + 0.015; // 被微风吹拂吸向前方
                }
                p.mesh.geometry.attributes.position.needsUpdate = true;
                
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            composer.render();
        }

        // 启动引擎
        initThree();
        initHandTracking();

    </script>
</body>
